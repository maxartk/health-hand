# Include inside the Health Hand HTTPS server block before the generic /webhook/ location.
# Backend event ingestion is intentionally available only through n8n's loopback listener.
location = /webhook/health-hand-backend-events {
    return 404;
}

location /webhook/ {
    proxy_pass http://127.0.0.1:5678/webhook/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
